# Render Blueprint - deploys the CoolFix app as an always-on web service.
# Import: Render Dashboard -> New -> Blueprint -> connect this repo.
services:
  - type: web
    name: coolfix-whatsapp
    runtime: docker
    # FREE plan for testing: $0, but the app sleeps when idle (first request after
    # ~15 min takes 30-60s to wake) and the database resets on each deploy. When you
    # connect a real business, switch plan to "starter" and re-add a "disk:" block
    # mounted at /data with DB_PATH=/data/coolfix.db so data persists.
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: mock            # set to "openai" and add OPENAI_API_KEY to go live
      - key: WHATSAPP_PROVIDER
        value: mock            # n8n does the sending; app stays mock (no double-send)
      - key: META_VERIFY_TOKEN
        value: coolfix-verify-token
      - key: DB_PATH
        value: /app/coolfix.db   # free tier has no persistent disk; ephemeral is fine for testing
      # Secrets - set these in the Render dashboard (never commit them):
      - key: DASHBOARD_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
